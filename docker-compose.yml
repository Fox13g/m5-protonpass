services:
  sentinel-bridge:
    build:
      context: ./bridge
      dockerfile: Dockerfile
    container_name: sentinel-bridge
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - BRIDGE_HOST=0.0.0.0
      - BRIDGE_PORT=8443
      - STATE_DIR=/app/data
      - PROVISION_OUT_DIR=/app/provision-out
      - PROTON_PASS_KEY_PROVIDER=fs
      - PROTON_PASS_NO_UPDATE_CHECK=1
    ports:
      - "127.0.0.1:8448:8443"
    volumes:
      # Persiste a sessão autenticada e chaves locais do pass-cli oficial
      - proton_pass_data:/home/sentinel/.local/share/proton-pass-cli
      - proton_pass_config:/home/sentinel/.config/proton-pass-cli
      # Persiste chaves geradas pelo provisionamento, estado de nonces e cache de revisão
      - sentinel_state:/app/data
      # Exporta o ficheiro cardputer_provision.json para copiar ao cartão microSD do Cardputer
      - ./provision-out:/app/provision-out
    networks:
      - sentinel_net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8443/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  sentinel-cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: sentinel-cloudflared
    profiles:
      - embedded-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      sentinel-bridge:
        condition: service_healthy
    networks:
      - sentinel_net
    security_opt:
      - no-new-privileges:true

volumes:
  proton_pass_data:
  proton_pass_config:
  sentinel_state:

networks:
  sentinel_net:
    driver: bridge
    internal: false

